[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tools4obsproc"
version = "0.1.0"
description = "Tools for reading GSI-style conventional observation diag files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "xarray", "netCDF4"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
